name: CI
on:
  push:
    # Feature and fix branches are validated on push so a candidate commit has
    # evidence before a pull request exists.
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
jobs:
  umbrella:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pip install ruff
      - run: ruff check --select E9,F,I risarms_host tests
      - name: Shell script syntax
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh' 'deployment/void/etc/sv/**/run')
      - run: python -m pytest -q --tb=no
      - name: Umbrella CLI smoke
        run: |
          risarms-host version
          risarms-host doctor --root .
  linux-macos:
    name: CLI smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: risarms-host version
      - run: risarms-host doctor --root .
